name: CI

# Definition-of-done gate for this offline claim viewer: `npm run verify`
# (typecheck -> vitest -> build -> Playwright e2e) is the single command
# that has to stay green. This workflow exists to run that command on every
# push/PR so the gate isn't only ever run by a maintainer locally — see
# AUDIT_REPORT.md's "Documented DoD test/CI gates absent" finding and
# docs/BUILD_PLAN.md §10, which name npm run verify's four stages as the
# release DoD.
#
# Runs on windows-latest (not ubuntu) deliberately: this is a Windows
# Electron app (electron-builder's win.target: 'portable' build step and
# the Playwright e2e suite that launches the real Windows Electron binary
# both need a Windows runner to be meaningful).

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm run verify (typecheck + vitest + build + playwright e2e)
        run: npm run verify

      - name: Upload portable build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-exe
          path: release/*.exe
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
